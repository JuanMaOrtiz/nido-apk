<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1226">
<title>Dispositivos Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Nido's plum, its glass cards and its gradient; one column of devices, newest version first. */
  :root {
    --bg: #1c1226; --bg2: #2a1a36; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
    --fg: #f6f1fb; --dim: #b9aec8; --a: #8e6cef; --b: #e06c9f; --ok: #4fe38c; --bad: #ff6b6b; --wait: #ffc266;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--fg); font: 15px/1.35 var(--body);
    background: radial-gradient(1200px 700px at 10% -10%, #3a2257 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 110%, #4a1d3e 0%, transparent 55%), var(--bg);
    padding-block: 24px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mark { width: 34px; height: 34px; flex: none; }
  h1 { font: 600 24px/1.1 var(--display); margin: 0; letter-spacing: .2px; text-wrap: balance; }
  .sub { color: var(--dim); font-size: 13px; line-height: 1.3; margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
          font-size: 12px; line-height: 1.4; letter-spacing: .2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.ok { background: rgba(79,227,140,.16); color: var(--ok); }
  .pill.old { background: rgba(255,194,102,.16); color: var(--wait); }
  .pill.gray { background: var(--card); color: var(--dim); }
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px;
          display: grid; justify-items: center; align-content: center; gap: 4px; text-align: center; }
  .tile b { display: block; font: 600 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tile span { display: block; color: var(--dim); font-size: 12px; line-height: 1.25; }
  .ver b { color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 18px minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); opacity: .5; }
  .dot.on { background: var(--ok); opacity: 1; box-shadow: 0 0 0 3px rgba(79,227,140,.14); }
  .st { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; }
  .st.on { color: var(--ok); } .st.sleep { color: var(--wait); } .st.off { color: var(--dim); }
  .st.lead { width: 18px; height: 18px; margin: 0; }
  .row.isoff > :nth-child(-n+2) { opacity: .4; }   /* off: the icon and the name dimmer */
  .st.none::before { content: ""; display: block; width: 6px; height: 6px; margin: 6px; border-radius: 50%; background: var(--dim); opacity: .5; }
  .seen { display: inline-flex; align-items: center; gap: 6px; }
  .seen .dot { width: 7px; height: 7px; }
  .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; color: var(--dim); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .st { margin-right: 0; }
  .fresh { display: inline-block; width: 52px; height: 6px; border-radius: 3px; vertical-align: 1px; margin-right: 2px;
           background: linear-gradient(90deg, rgb(79,227,140), rgba(185,174,200,.45)); }
  .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { color: var(--dim); font-size: 12px; line-height: 1.3; margin-top: 2px; }
  .right { display: grid; justify-items: end; gap: 4px; }
  .seen { color: var(--dim); font-size: 11.5px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  h2 { font: 600 12px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); margin: 4px 4px -6px; }
  .faded .row { opacity: .6; }
  .note { color: var(--dim); font-size: 12px; line-height: 1.4; text-align: center; margin: 0 8px; text-wrap: balance; }
  .error { color: var(--bad); }
  .row { cursor: pointer; transition: background .15s; }
  .row:hover, .row:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .chev { color: var(--dim); opacity: .6; font-size: 18px; line-height: 1; margin-left: 2px; }
  dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 20px; color: var(--fg);
           background: linear-gradient(160deg, #2e1d3d, #22152d); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  dialog::backdrop { background: rgba(10,5,15,.6); backdrop-filter: blur(3px); }
  .dhead { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .dhead h3 { margin: 0; font: 600 19px/1.2 var(--display); overflow-wrap: anywhere; }
  .dhead .meta { margin-top: 3px; }
  .close { margin-left: auto; flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
           background: rgba(255,255,255,.08); color: var(--fg); font-size: 18px; line-height: 1; }
  .close:focus-visible { outline: 2px solid var(--a); }
  .facts { padding: 2px 18px 12px; }
  .fact { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 11px 0;
          border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.3; }
  .fact:last-child { border-bottom: 0; }
  .fact .k { color: var(--dim); flex: none; }
  .fact .v { text-align: right; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .facts .good { color: var(--ok); } .facts .bad { color: var(--bad); } .facts .dimv { color: var(--dim); font-weight: 400; }
  .facts .tiny { font: 12px/1.3 ui-monospace, Consolas, monospace; color: var(--dim); font-weight: 400; }
  .blockbtn { display: block; width: calc(100% - 36px); margin: 0 18px 18px; padding: 12px; border-radius: 12px; cursor: pointer;
              font: 600 14px/1 var(--body); border: 1px solid rgba(255,107,107,.45); background: rgba(255,107,107,.12); color: var(--bad); }
  .blockbtn.undo { border-color: var(--line); background: rgba(255,255,255,.06); color: var(--fg); }
  .blockbtn:disabled { opacity: .5; cursor: default; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 600 10.5px/1.5 var(--body);
         letter-spacing: .3px; background: rgba(255,107,107,.16); color: var(--bad); vertical-align: 2px; }
  .row.isblocked .name { color: var(--dim); }
  .bstate { font-size: 12px; line-height: 1.3; margin-top: 3px; color: var(--wait); }
  .bstate.took { color: var(--bad); }
  /* The log: what's new stands out (red edge, a badge by the title) until "Ya lo vi"; the rest under "Registro". */
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; padding: 2px 9px; border-radius: 999px;
           font: 600 12px/1.5 var(--body); background: rgba(255,107,107,.18); color: var(--bad); cursor: pointer; border: 0; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .news { background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.5); border-radius: 18px; overflow: hidden;
          box-shadow: 0 0 0 3px rgba(255,107,107,.08); }
  .news.calm { border-color: rgba(255,194,102,.45); box-shadow: none; }
  .news.quiet { background: var(--card); border-color: var(--line); box-shadow: none; }
  .line.isnew { background: rgba(255,194,102,.08); }
  .line.isnew.problem { background: rgba(255,107,107,.12); }
  .line.problem:not(.isnew) i { opacity: .55; }
  .nhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .nhead b { font: 600 15px/1.2 var(--display); }
  .nhead button { margin-left: auto; font: 600 13px/1 var(--body); padding: 9px 14px; border-radius: 10px; cursor: pointer;
                  border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--fg); }
  .line { display: grid; grid-template-columns: 9px minmax(0,1fr); gap: 10px; padding: 10px 16px; align-items: baseline; }
  .line + .line { border-top: 1px solid var(--line); }
  .line i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); opacity: .6; display: block; transform: translateY(-1px); }
  .line.problem i { background: var(--bad); opacity: 1; }
  .line.isnew.problem .txt, .line.live .txt { color: #ffd0d0; }
  .line.live i { background: var(--bad); opacity: 1; box-shadow: 0 0 0 3px rgba(255,107,107,.2); }
  .txt { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .who { color: var(--dim); font-size: 11.5px; line-height: 1.3; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .more { display: block; width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--line); background: none;
          color: var(--a); font: 600 13px/1 var(--body); cursor: pointer; }
  .logbtn { justify-self: center; font: 600 13px/1 var(--body); padding: 10px 16px; border-radius: 12px; cursor: pointer;
            border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .dlog { padding: 0 18px 14px; }
  .dlog h4 { margin: 4px 0 6px; font: 600 11px/1 var(--body); letter-spacing: 1.1px; text-transform: uppercase; color: var(--dim); }
  .dlog .line { padding: 7px 0; }
  @media (max-width: 520px) {
    body { padding-block: 18px 28px; }
    main { gap: 14px; }
    h1 { font-size: 22px; }
    .summary { gap: 8px; }
    .tile { padding: 10px 6px; border-radius: 14px; } .tile b { font-size: 21px; } .tile span { font-size: 11.5px; }
    .row { padding: 11px 14px; gap: 10px; }
  }
  @media (prefers-reduced-motion: no-preference) { .dot.on { transition: box-shadow .3s; } }
  .lock { max-width: 360px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
          padding: 26px 22px; display: grid; gap: 14px; text-align: center; }
  .lock p { margin: 0; color: var(--dim); font-size: 14px; }
  .lock input { font: 600 28px/1 var(--display); letter-spacing: 10px; text-align: center; width: 100%; padding: 14px 10px;
                border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--fg); }
  .lock input:focus { outline: 2px solid var(--a); outline-offset: 2px; }
  .lock button { font: 600 16px/1 var(--body); padding: 14px; border: 0; border-radius: 14px; color: #fff; cursor: pointer;
                 background: linear-gradient(90deg, var(--a), var(--b)); }
  .lock button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<form class="lock" id="lock" hidden>
  <h1>Dispositivos Nido</h1>
  <p>Escribí el PIN para ver los dispositivos. Este equipo lo recuerda.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="PIN">
  <button type="submit">Entrar</button>
  <p id="pin-msg" aria-live="polite"></p>
</form>
<main id="main" hidden>
  <header>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e6cef"/><stop offset="1" stop-color="#e06c9f"/></linearGradient></defs>
      <path d="M17 4 L20 15 L31 18 L20 21 L17 32 L14 21 L3 18 L14 15 Z" fill="url(#g)"/>
      <path d="M31 24 L32.6 28.4 L37 30 L32.6 31.6 L31 36 L29.4 31.6 L25 30 L29.4 28.4 Z" fill="url(#g)"/>
    </svg>
    <div>
      <h1>Dispositivos Nido</h1>
      <div class="sub"><span id="updated">Cargando…</span><span class="ver" id="ver" hidden> · Última versión <b id="latest">—</b></span><button class="badge" id="badge" type="button" hidden></button></div>
    </div>
  </header>

  <section class="news" id="news" aria-live="polite" hidden></section>

  <section class="summary" aria-label="Resumen">
    <div class="tile"><b id="n-all">—</b><span>dispositivos</span></div>
    <div class="tile"><b id="n-on">—</b><span>en línea ahora</span></div>
    <div class="tile"><b id="n-latest">—</b><span>con la última</span></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>
  <h2 id="blk-title" hidden>Bloqueados</h2>
  <section class="list" id="blk" hidden></section>
  <dialog id="detail" aria-labelledby="d-name">
    <div class="dhead"><div><h3 id="d-name"></h3><div class="meta" id="d-model"></div></div>
      <button class="close" id="d-close" aria-label="Cerrar">×</button></div>
    <div class="facts" id="d-facts"></div>
    <div class="dlog" id="d-log"></div>
    <button class="blockbtn" id="d-block" type="button"></button>
  </dialog>
  <h2 id="log-title" hidden>Registro</h2>
  <section class="list" id="log" hidden></section>
  <div class="legend" id="legend"></div>
  <p class="note">«En línea»: visto en los últimos 15 minutos. Los cambios aparecen al instante.</p>
</main>
<script>
  var LOCK = {salt: "S4hulR5DqC9hAbc0lagx4A==", iv: "Ky2HsHDMPIlSDpz4", data: "5ohcX5wDidoaC/A07jHmpXDkiuFApd9eMs9J2cWkbje1La9kLkvahFR/1qulVVz0vWTnfbJ72ZNQ3v27jeP62MV/37uiWjQFCFJbJocGV5ZAxk2YY4WZ", iter: 250000}, DB = null;
  var ONLINE_MS = 15 * 60 * 1000;
  // This page's own version (tools/publish-page.sh sets it): when the database says a newer one is up, the page
  // reloads itself, once per version (a reload that still brings the old one doesn't loop).
  var PAGE = "1795563077";
  var latest = null, blocked = {};

  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return "ahora";
    var m = Math.round(s / 60); if (m < 60) return "hace " + m + " min";
    var h = Math.round(m / 60); if (h < 48) return "hace " + h + " h";
    return "hace " + Math.round(h / 24) + " días";
  }
  function code(v) { var m = /^1\.(\d+)/.exec(v || ""); return m ? parseInt(m[1], 10) : 0; }
  // How old a version is, in color: one behind the amber, redder with each one more, full red from 6 behind.
  function age(v) {
    var t = Math.min(1, Math.max(0, (latest - code(v) - 1) / 5));
    var a = [255, 194, 102], b = [255, 90, 90];
    return "rgb(" + a.map(function (x, i) { return Math.round(x + (b[i] - x) * t); }).join(",") + ")";
  }
  // On (screen on, or an older Nido that doesn't say), in standby (its screen off, still answering) or out of reach
  // (nothing for 15 minutes: off, or a standby that cuts its network).
  // Off (nothing for 15 minutes: unplugged, or a standby that cuts its network), asleep (screen off, still answering),
  // on (screen on). An older Nido doesn't say its screen: no icon while it answers.
  function state(d) {
    if (Date.now() - d.seen >= ONLINE_MS) return "off";
    return d.screen === "off" ? "sleep" : d.screen === "on" ? "on" : "";
  }
  var ICONS = {
    on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    sleep: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
    off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>'
  };
  var STATE_NAME = { on: "Prendido", sleep: "Dormido", off: "Apagado o sin conexión" };
  function icon(st) {
    if (!st) return null;
    var i = el("span", "st " + st); i.innerHTML = ICONS[st]; i.title = STATE_NAME[st]; i.setAttribute("aria-label", STATE_NAME[st]);
    return i;
  }
  // The dot: how recent its last report is, green just now to grey an hour or more ago.
  function freshDot(seen) {
    var t = Math.min(1, Math.max(0, (Date.now() - seen) / 3600000));
    var g = [79, 227, 140], y = [185, 174, 200];
    var c = g.map(function (x, i) { return Math.round(x + (y[i] - x) * t); });
    var dot = el("span", "dot");
    dot.style.background = "rgb(" + c.join(",") + ")";
    dot.style.opacity = String(1 - .5 * t);
    if (t < .25) dot.style.boxShadow = "0 0 0 3px rgba(79,227,140," + (.14 * (1 - t * 4)).toFixed(3) + ")";
    return dot;
  }
  (function () {
    var lg = document.getElementById("legend");
    ["on", "sleep", "off"].forEach(function (k) { var s = el("span"); s.appendChild(icon(k)); s.appendChild(document.createTextNode(STATE_NAME[k].replace(" o sin conexión", ""))); lg.appendChild(s); });
    var f = el("span"); f.appendChild(el("i", "fresh")); f.appendChild(document.createTextNode("Último reporte: recién → hace 1 h")); lg.appendChild(f);
  })();
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function row(d) {
    var r = el("div", "row");
    // Left: how it is (on, asleep, off); an older Nido that doesn't say: a plain mark.
    if (state(d) === "off") r.className += " isoff";   // off: the whole row dimmer
    var ic = icon(state(d)) || el("span", "st none");
    ic.classList.add("lead");
    r.appendChild(ic);
    var mid = el("div");
    var nm = el("div", "name");
    nm.appendChild(document.createTextNode(d.name || "Sin nombre"));
    if (blocked[d.id]) r.className += " isblocked";
    mid.appendChild(nm);
    mid.appendChild(el("div", "meta", d.model || ""));
    r.appendChild(mid);
    if (d.network) mid.lastChild.textContent = (d.model || "") + " · " + d.network;
    if (blocked[d.id]) {
      var st = el("div", "bstate" + (d.blocked ? " took" : ""), d.blocked ? "Bloqueo aplicado" : "Bloqueo pendiente");
      mid.appendChild(st);
    }
    var right = el("div", "right");
    var isLatest = latest && code(d.version) >= latest;
    var pill = el("span", "pill " + (latest ? (isLatest ? "ok" : "old") : "gray"), "Nido " + (d.version || "?"));
    if (latest && !isLatest) { var c = age(d.version); pill.style.color = c; pill.style.background = c.replace("rgb", "rgba").replace(")", ",.16)"); }
    right.appendChild(pill);
    var seen = el("span", "seen"); seen.appendChild(freshDot(d.seen)); seen.appendChild(document.createTextNode(ago(d.seen)));
    right.appendChild(seen);   // the last report: its dot, green just now to grey an hour ago
    r.appendChild(right);
    r.appendChild(el("span", "chev", "›"));
    r.tabIndex = 0; r.setAttribute("role", "button");
    r.addEventListener("click", function () { detail(d); });
    r.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); detail(d); } });
    return r;
  }

  // A device's detail: everything it said, in a window over the list.
  function time24(ms) {
    var t = new Date(ms), today = t.toDateString() === new Date().toDateString();   // today: just the time
    return (today ? "" : t.toLocaleDateString("es-AR", { day: "numeric", month: "short" }) + " ") + t.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function detail(d) {
    document.getElementById("d-name").textContent = d.name || "Sin nombre";
    document.getElementById("d-model").textContent = d.model || "";
    var dl = document.getElementById("d-facts"); dl.textContent = "";
    var newer = d.adb !== undefined;   // what 1.50 and newer say
    function fact(label, value, cls) {
      var f = el("div", "fact"); f.appendChild(el("span", "k", label)); f.appendChild(el("span", "v" + (cls ? " " + cls : ""), value));
      dl.appendChild(f);
    }
    var isLatest = latest && code(d.version) >= latest;
    fact("Versión", "Nido " + (d.version || "?") + (latest ? (isLatest ? " · la última" : " · hay 1." + latest) : ""), isLatest ? "good" : null);
    if (latest && !isLatest) dl.lastChild.lastChild.style.color = age(d.version);
    var stt = state(d);
    fact("Estado", stt ? STATE_NAME[stt] : "En línea", stt === "on" ? "good" : stt === "off" ? "dimv" : null);
    if (stt === "sleep") dl.lastChild.lastChild.style.color = "var(--wait)";
    fact("Último reporte", time24(d.seen) + " · " + ago(d.seen), Date.now() - d.seen < ONLINE_MS ? null : "dimv");
    // How long the internet took to answer after the last wake (Nido measures it): -1, not within a minute.
    if (typeof d.wakeNetMs === "number") fact("Internet al despertar",
        d.wakeNetMs < 0 ? "No volvió en un minuto" : (d.wakeNetMs / 1000).toFixed(1).replace(".", ",") + " s",
        d.wakeNetMs < 0 || d.wakeNetMs > 10000 ? "bad" : null);
    if (!newer) fact("Permiso, red y perfil", "Se ven desde Nido 1.50", "dimv");
    else {
      var adb = { ok: ["Tiene permiso", "good"], lost: ["Lo perdió: no se actualiza solo", "bad"], closed: ["Sin entrada por ahora: no se actualiza solo", "bad"], off: ["Depuración apagada", "bad"] }[d.adb] || [d.adb, null];
      fact("Permiso de Nido", adb[0], adb[1]);
      fact("Red", d.network || "No se sabe", d.network ? null : "dimv");
      fact("Perfil", d.profile || "Sin perfil", d.profile ? null : "dimv");
      if (d.mode !== undefined) {
        fact("Modo", d.mode === "nido" ? "Nido" : "Pantalla de inicio original", d.mode === "nido" ? null : "dimv");
        fact("Dirección", d.ip || "No se sabe", d.ip ? null : "dimv");
        fact("Actualización", d.updateError || "Sin problemas", d.updateError ? "bad" : null);
      }
    }
    fact("Identificador", d.id, "tiny");
    var mine = logLines().filter(function (l) { return l.by === d.name; }).slice(0, 6), dlg = document.getElementById("d-log");
    dlg.textContent = "";
    if (mine.length) { dlg.appendChild(el("h4", null, "Registro")); mine.forEach(function (l) { dlg.appendChild(logLine(l, false)); }); }
    if (blocked[d.id]) fact("Bloqueo", d.blocked ? "Aplicado: no puede usar Nido" : "Pendiente: se confirma cuando el aparato tenga Nido 1.52", d.blocked ? "bad" : null);
    var b = document.getElementById("d-block"), isB = !!blocked[d.id];
    b.disabled = false;
    b.className = "blockbtn" + (isB ? " undo" : "");
    b.textContent = isB ? "Desbloquear" : "Bloquear este dispositivo";
    b.onclick = function () {
      if (!isB && !confirm("¿Bloquear «" + (d.name || d.id) + "»?\n\nVuelve a su pantalla de inicio de fábrica y no puede usar Nido. Se puede desbloquear después.")) return;
      b.disabled = true;
      fetch(DB + "/nido/blocked/" + encodeURIComponent(d.id) + ".json", isB ? { method: "DELETE" }
          : { method: "PUT", body: JSON.stringify({ at: Date.now(), name: d.name || "" }) })
        .then(function (r) { if (!r.ok) throw 0; if (isB) delete blocked[d.id]; else blocked[d.id] = true; detail(d); show(); })
        .catch(function () { b.disabled = false; b.textContent = "No se pudo. Probá de nuevo."; });
    };
    var box = document.getElementById("detail");
    if (!box.open) { if (box.showModal) box.showModal(); else box.setAttribute("open", ""); }
  }

  function render(devices) {
    var all = Object.keys(devices || {}).map(function (k) { var d = devices[k]; d.id = k; return d; })
      .filter(function (d) { return d && d.seen; })
      .sort(function (a, b) { return code(b.version) - code(a.version) || b.seen - a.seen; });
    // The same name twice: the one seen last is the device; the other is an old entry (it identified itself another way),
    // left out.
    var byName = {}, current = [], old = [];
    all.slice().sort(function (a, b) { return b.seen - a.seen; }).forEach(function (d) {
      var key = (d.name || d.id).toLowerCase();
      if (byName[key]) old.push(d); else { byName[key] = true; current.push(d); }
    });
    // On first, then asleep, then an older Nido that doesn't say, then off; within each, the newest version first.
    var RANK = { on: 0, sleep: 1, "": 2, off: 3 };
    current.sort(function (a, b) { return RANK[state(a)] - RANK[state(b)] || code(b.version) - code(a.version) || b.seen - a.seen; });
    // The blocked ones, on their own under the list (not counted above).
    var blk = current.filter(function (d) { return blocked[d.id]; });
    current = current.filter(function (d) { return !blocked[d.id]; });
    var blkBox = document.getElementById("blk"); blkBox.textContent = "";
    blk.forEach(function (d) { blkBox.appendChild(row(d)); });
    blkBox.hidden = document.getElementById("blk-title").hidden = !blk.length;
    var list = document.getElementById("list"); list.textContent = "";
    current.forEach(function (d) { list.appendChild(row(d)); });
    if (!current.length) list.appendChild(el("div", "row", "Todavía no hay dispositivos en la lista."));
    document.getElementById("n-all").textContent = current.length;
    document.getElementById("n-on").textContent = current.filter(function (d) { return Date.now() - d.seen < ONLINE_MS; }).length;
    document.getElementById("n-latest").textContent = latest ? current.filter(function (d) { return code(d.version) >= latest; }).length : "—";
    status();
  }

  (function () {
    var box = document.getElementById("detail");
    document.getElementById("d-close").addEventListener("click", function () { box.close ? box.close() : box.removeAttribute("open"); });
    box.addEventListener("click", function (e) { if (e.target === box) box.close(); });   // a tap outside closes it
  })();
  // The database tells the page each change as it happens (its event stream, as the TVs listen): no asking every
  // 30 seconds. Each stream keeps its part of the tree; the browser reconnects a cut one by itself, and on
  // reconnecting the database sends it whole again.
  var devices = null, live = {}, drawSoon = 0;
  function watch(path, done) {
    var tree = null, es = new EventSource(DB + "/" + path + ".json");
    function apply(e, merge) {
      var m = JSON.parse(e.data), keys = m.path.split("/").filter(Boolean);
      if (!keys.length) {
        if (merge) { tree = tree || {}; for (var k in m.data) tree[k] = m.data[k]; } else tree = m.data;
      } else {
        if (tree === null || typeof tree !== "object") tree = {};
        var o = tree;
        for (var i = 0; i < keys.length - 1; i++) { if (!o[keys[i]] || typeof o[keys[i]] !== "object") o[keys[i]] = {}; o = o[keys[i]]; }
        var last = keys[keys.length - 1];
        if (merge) { o[last] = o[last] && typeof o[last] === "object" ? o[last] : {}; for (var j in m.data) o[last][j] = m.data[j]; }
        else if (m.data === null) delete o[last]; else o[last] = m.data;
      }
      live[path] = true; done(tree);
    }
    es.addEventListener("put", function (e) { apply(e, false); });
    es.addEventListener("patch", function (e) { apply(e, true); });
    es.onerror = function () { live[path] = false; status(); };
  }
  // A few changes at once (a TV's whole report) are drawn once.
  function show() {
    if (drawSoon) return;
    drawSoon = setTimeout(function () { drawSoon = 0; if (devices !== null) render(devices); drawLog(); }, 150);
  }

  // The log (nido/log): written by the TVs (Journal), the watcher and the inbox (tools/apps_watch.py, apps_inbox.py).
  // What came after "Ya lo vi" (nido/logSeen, shared by every phone and computer that opens this page) is new: on top,
  // in red, with a badge by the title. The rest is under "Registro". Kept to the last 200 lines.
  // New is by arrival, not by the line's own time: a TV that was offline sends its lines later with the time they
  // happened (and a TV's clock can be off), so they came already "seen". The database names each line as it arrives
  // (its keys sort by the server's time): "Ya lo vi" keeps the last one seen (nido/logSeenKey).
  // The watcher runs every hour, and GitHub sometimes runs it up to an hour late: flagged after 3 hours.
  var LOG_KEEP = 200, WATCH_LATE = 180 * 60 * 1000;
  var logTree = null, logSeen = 0, logSeenKey = "", watchAt = null, logShown = 8, trimmed = false;
  function logLines() {
    return Object.keys(logTree || {}).map(function (k) { var l = logTree[k] || {}; l.key = k; return l; })
      .filter(function (l) { return l.at && l.text; }).sort(function (a, b) { return a.key < b.key ? 1 : a.key > b.key ? -1 : 0; });
  }
  function logLine(l, withWho) {
    var r = el("div", "line" + (l.level === "problem" ? " problem" : "") + (l.live ? " live" : "") + (l.fresh ? " isnew" : ""));
    r.appendChild(el("i"));
    var m = el("div"); m.appendChild(el("div", "txt", l.text));
    m.appendChild(el("div", "who", (withWho !== false && l.by ? l.by + " · " : "") + (l.at ? time24(l.at) + " · " + ago(l.at) : "ahora")));
    r.appendChild(m);
    return r;
  }
  // What's wrong right now, not a line anyone wrote: the watcher (or the inbox) not running.
  function liveProblems() {
    var out = [];
    if (watchAt && Date.now() - watchAt > WATCH_LATE) out.push({ live: true, level: "problem", by: "Página",
      text: "El vigilante de apps no corre desde " + ago(watchAt) + ". Puede que se hayan acabado los minutos "
        + "gratis de GitHub del mes, o que GitHub lo haya pausado (lo hace con los repositorios sin cambios en 60 días)." });
    return out;
  }
  function drawLog() {
    if (logTree === null) return;
    var lines = logLines(), live = liveProblems();
    lines.forEach(function (l) { l.fresh = logSeenKey ? l.key > logSeenKey : l.at > logSeen; });
    var fresh = lines.filter(function (l) { return l.fresh; });
    var bad = fresh.filter(function (l) { return l.level === "problem"; }).length + live.length;
    // What came after "Ya lo vi" (and what's wrong right now): on top, red with a problem, amber without.
    var news = document.getElementById("news"); news.textContent = "";
    news.hidden = !fresh.length && !live.length;
    news.className = "news" + (bad ? "" : " calm");
    if (!news.hidden) {
      var h = el("div", "nhead");
      h.appendChild(el("b", null, fresh.length ? (fresh.length === 1 ? "1 novedad" : fresh.length + " novedades") : "Problema ahora"));
      if (fresh.length) {
        var ok = el("button", null, "Ya lo vi"); ok.type = "button";
        ok.onclick = function () {
          var top = fresh[0].key, at = Math.max.apply(null, fresh.map(function (l) { return l.at; }));
          logSeenKey = top; logSeen = Math.max(logSeen, at); drawLog();
          fetch(DB + "/nido.json", { method: "PATCH", body: JSON.stringify({ logSeenKey: top, logSeen: logSeen }) }).catch(function () {});
        };
        h.appendChild(ok);
      }
      news.appendChild(h);
      live.concat(fresh).forEach(function (l) { news.appendChild(logLine(l)); });
    }
    // The rest, under the devices, always there: a few lines, more on asking.
    var old = lines.filter(function (l) { return !l.fresh; }), box = document.getElementById("log");
    box.hidden = document.getElementById("log-title").hidden = !old.length;
    box.textContent = "";
    old.slice(0, logShown).forEach(function (l) { box.appendChild(logLine(l)); });
    if (old.length > logShown) {
      var more = el("button", "more", "Ver " + Math.min(30, old.length - logShown) + " más"); more.type = "button";
      more.onclick = function () { logShown += 30; drawLog(); };
      box.appendChild(more);
    }
    var badge = document.getElementById("badge");
    badge.hidden = !fresh.length && !live.length;
    badge.textContent = bad ? (bad === 1 ? "1 problema" : bad + " problemas") : fresh.length + (fresh.length === 1 ? " nueva" : " nuevas");
    badge.onclick = function () { news.scrollIntoView({ behavior: "smooth", block: "start" }); };
    // Only the last 200 kept: the oldest deleted, once per visit.
    if (!trimmed && lines.length > LOG_KEEP) {
      trimmed = true;
      lines.slice(LOG_KEEP).forEach(function (l) { fetch(DB + "/nido/log/" + encodeURIComponent(l.key) + ".json", { method: "DELETE" }).catch(function () {}); });
    }
  }
  function status() {
    var u = document.getElementById("updated");
    var ok = live["remote/devices"] !== false;
    u.className = ok ? "" : "error";
    u.textContent = ok ? (devices === null ? "Cargando…" : "En vivo") : "Reconectando…";
  }
  function newest(j) {
    if (j && j.version) { latest = parseInt(j.version, 10); document.getElementById("latest").textContent = "1." + latest; document.getElementById("ver").hidden = false; show(); return; }
    // Only if the database has none: GitHub (it limits each address to 60 reads an hour).
    fetch("https://api.github.com/repos/JuanMaOrtiz/nido-apk/releases/latest", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (g) { var m = /v?(\d+)/.exec((g && g.tag_name) || ""); if (m) newest({ version: m[1] }); }).catch(function () {});
  }

  // The database's address comes only from the PIN: it's kept encrypted with it (PBKDF2 + AES-GCM).
  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function unlock(pin) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(LOCK.salt), iterations: LOCK.iter },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCK.iv) }, key, bytes(LOCK.data));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function start(db) {
    DB = db;
    document.getElementById("lock").hidden = true;
    document.getElementById("main").hidden = false;
    watch("remote/devices", function (t) { devices = t || {}; show(); });
    // All of nido/ on one stream: a browser keeps at most 6 open to a server, and one stream per part (7 with the log)
    // left none for "Ya lo vi" or blocking, which then waited forever.
    var latestWas;
    watch("nido", function (t) {
      t = t || {};
      blocked = t.blocked || {};
      logTree = t.log || {};
      logSeen = typeof t.logSeen === "number" ? t.logSeen : 0;
      logSeenKey = typeof t.logSeenKey === "string" ? t.logSeenKey : "";
      watchAt = typeof t.watchAt === "number" ? t.watchAt : null;
      var lat = JSON.stringify(t.latest === undefined ? null : t.latest);
      if (lat !== latestWas) { latestWas = lat; newest(t.latest); }
      show();
      var v = t.page;
      if (v === null || v === undefined || String(v) === PAGE) return;
      var tried = null;
      try { tried = sessionStorage.getItem("reloadedFor"); } catch (e) {}
      if (tried === String(v)) return;
      try { sessionStorage.setItem("reloadedFor", String(v)); } catch (e) {}
      location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
    });
    // What only time changes ("hace X min", the dot, off after 15 minutes): drawn again here, nothing asked.
    setInterval(show, 30000);
  }
  function ask() {
    var form = document.getElementById("lock"), input = document.getElementById("pin"), msg = document.getElementById("pin-msg");
    form.hidden = false; input.focus();
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      msg.textContent = "Comprobando…"; msg.className = "";
      var pin = input.value.replace(/\D/g, "");
      unlock(pin).then(function (db) {
        try { localStorage.setItem("nido-pin", pin); } catch (x) {}
        start(db);
      }).catch(function () { msg.textContent = "PIN incorrecto. Probá de nuevo."; msg.className = "error"; input.select(); });
    });
  }
  // The PIN after a # in the address (a bookmark keeps it; what follows # never leaves the device), else the one this
  // device remembers, else asked.
  var fromUrl = (location.hash || "").replace(/[^0-9]/g, "") || (new URLSearchParams(location.search).get("pin") || "").replace(/[^0-9]/g, "");
  var saved = null;
  try { saved = localStorage.getItem("nido-pin"); } catch (x) {}
  var tryPin = fromUrl || saved;
  if (tryPin) unlock(tryPin).then(function (db) {
    try { localStorage.setItem("nido-pin", tryPin); } catch (x) {}
    start(db);
  }).catch(ask); else ask();
</script>
</body>
</html>
